version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: reachinbox-postgres
    restart: always
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: reachinbox_scheduler
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reachinbox -d reachinbox_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Job Broker for BullMQ
  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Elasticsearch for Full-Text Search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: reachinbox-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

volumes:
  pgdata:
  redisdata:
  esdata:
